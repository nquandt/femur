on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9][0-9][0-9]"
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Verify commit exists in origin/master
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/master
    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
    - name: Build
      run: dotnet build --configuration Release /p:Version=${VERSION}
    - name: Test
      run: dotnet test --configuration Release /p:Version=${VERSION} --no-build
    - name: Pack
      run: |
        dotnet pack ./src/AspNetCore/Endpoints/src/Femur.AspNetCore.Endpoints.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/AspNetCore/src/Femur.AspNetCore.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/DependencyInjection/src/Femur.DependencyInjection.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/FileSystem/AzureBlob/src/Femur.FileSystem.AzureBlob.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/FileSystem/src/Femur.FileSystem.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Hosting/src/Femur.Hosting.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Hosting/Web/src/Femur.Hosting.Web.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Html/Parser/src/Femur.Html.Parser.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Logging/Bootstrap/src/Femur.Logging.Bootstrap.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markdown/Abstractions/src/Femur.Markdown.Abstractions.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markdown/Parser/src/Femur.Markdown.Parser.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markdown/Renderer/src/Femur.Markdown.Renderer.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markdown/Extended/Abstractions/src/Femur.Markdown.Extended.Abstractions.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markdown/Extended/Parser/src/Femur.Markdown.Extended.Parser.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Markup.Abstractions/src/Femur.Markup.Abstractions.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Parsing/src/Femur.Parsing.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Serialization/src/Femur.Serialization.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/src/Femur.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Xml/Abstractions/src/Femur.Xml.Abstractions.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
        dotnet pack ./src/Xml/Parser/src/Femur.Xml.Parser.csproj --configuration Release /p:Version=${VERSION} --no-build --output ./artifacts/
    - name: Push
      run: |
        dotnet nuget push ./artifacts/Femur.AspNetCore.Endpoints.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.AspNetCore.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.DependencyInjection.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.FileSystem.AzureBlob.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.FileSystem.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Hosting.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Hosting.Web.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Html.Parser.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Logging.Bootstrap.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markdown.Abstractions.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markdown.Parser.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markdown.Renderer.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markdown.Extended.Abstractions.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markdown.Extended.Parser.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Markup.Abstractions.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Parsing.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Serialization.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Xml.Abstractions.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        dotnet nuget push ./artifacts/Femur.Xml.Parser.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}